<h1>Вход</h1>

@if (error) {
  <p>{{ error }}</p>
}
<form (ngSubmit)="login()">

  <div>
    <label>Логин</label>
    <input name="username" [(ngModel)]="username" />
  </div>


  <div>
    <label>Пароль</label>
    <input name="password" type="password" [(ngModel)]="password" />
  </div>

  <button type="submit">Войти</button>
</form>
