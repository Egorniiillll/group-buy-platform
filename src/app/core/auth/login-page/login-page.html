<div class="page">
  <div class="card">
    <h1>Вход</h1>
    <p>Войдите в систему, чтобы управлять совместными покупками.</p>
    @if (error) {
      <p class="error">{{ error }}</p>
    }
    <form (ngSubmit)="login()">
      <div class="form-field">
        <label>Логин</label>
        <input
          name="username"
          [(ngModel)]="username"
          placeholder="Введите логин"
        />
      </div>

      <div class="form-field">
        <label>Пароль</label>
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Введите пароль"
        />
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>
</div>
